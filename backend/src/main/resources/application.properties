# Application
app.name=Portail ENSI
spring.application.name=portail-ensi

# Profil actif (dev par defaut : charge les donnees de demonstration)
spring.profiles.active=${SPRING_PROFILE:dev}

# Serveur
server.port=${SERVER_PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database (host/port/nom/user surchargeables ; mot de passe via .env, sans defaut)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portail_ensi}
spring.datasource.username=${DB_USER:portail_ensi}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway : structure uniquement par defaut.
# Le profil dev ajoute classpath:flyway/dev (donnees de demonstration).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.locations=classpath:flyway/schema

# Fichiers
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Securite JWT (secret via .env, sans defaut)
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

# CORS (origine du frontend Angular)
client.url=${CLIENT_URL:http://localhost:4200}

# URL de base de l'application (lien dans les emails) - a adapter en prod
app.base-url=${APP_BASE_URL:http://localhost:4200}

# Email - identifiants via .env
# Fournisseur : smtp (local) ou brevo (prod, API HTTPS compatible Render gratuit)
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@ensi.ci}}
app.mail.from-name=${MAIL_FROM_NAME:Portail ENSI}
app.mail.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Rappels automatiques (cron quotidien + fenetre evenements)
app.rappel.cron=${RAPPEL_CRON:0 0 8 * * *}
app.rappel.jours-evenement=${RAPPEL_JOURS_EVENEMENT:3}

# Cotisations : mois de depart commun (AAAA-MM) si la date d'adhesion est absente
app.cotisation.mois-debut=${COTISATION_MOIS_DEBUT:}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# API
api.prefix=/ws
