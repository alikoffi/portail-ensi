buildscript {
	ext {
		springBootVersion = "3.2.3"
		postgresqlVersion = '42.6.1'
		flywaydbVersion = '9.22.3'
		jjwtVersion = '0.11.5'
		openApiVersion = '2.2.20'
	}
	repositories {
		mavenCentral()
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'ci.inphb.ensi'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Chargement d'un fichier .env (secrets hors du depot)
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Generation PDF (HTML -> PDF)
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	implementation 'com.openhtmltopdf:openhtmltopdf-slf4j:1.0.10'

	// Stockage objet compatible S3 - Backblaze B2 en production
	implementation 'software.amazon.awssdk:s3:2.25.70'

	implementation "org.flywaydb:flyway-core:$flywaydbVersion"
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
	implementation 'org.apache.commons:commons-lang3:3.18.0'

	// JWT
	implementation "io.jsonwebtoken:jjwt-api:$jjwtVersion"
	implementation "io.jsonwebtoken:jjwt-impl:$jjwtVersion"
	implementation "io.jsonwebtoken:jjwt-jackson:$jjwtVersion"

	runtimeOnly "org.postgresql:postgresql:$postgresqlVersion"

	developmentOnly "org.springframework.boot:spring-boot-devtools:$springBootVersion"

	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
