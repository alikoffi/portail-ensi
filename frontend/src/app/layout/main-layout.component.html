<div class="flex h-screen overflow-hidden bg-[#f6f8f7]">
  <!-- Sidebar -->
  <aside
    class="flex flex-col bg-ensi-700 text-white transition-all duration-300 ease-in-out"
    [class.w-64]="sidebarOuverte()"
    [class.w-0]="!sidebarOuverte()"
    [class.overflow-hidden]="!sidebarOuverte()"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 h-16 border-b border-white/10">
      <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-white/15 font-extrabold">E</div>
      <div class="leading-tight">
        <div class="font-bold tracking-wide">Portail ENSI</div>
        <div class="text-[11px] text-white/60">INPHB Yamoussoukro</div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
      @for (item of menu; track item.route) {
        @if (!item.adminSeulement || estAdmin()) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-white/15 text-white"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/75 hover:bg-white/10 hover:text-white transition-colors"
          >
            <i class="pi {{ item.icone }} text-base"></i>
            <span class="text-sm font-medium">{{ item.libelle }}</span>
          </a>
        }
      }
    </nav>

    <!-- Pied sidebar -->
    <div class="px-5 py-4 border-t border-white/10 text-[11px] text-white/50">
      © {{ annee }} • Promotion ENSI
    </div>
  </aside>

  <!-- Zone principale -->
  <div class="flex flex-col flex-1 min-w-0">
    <!-- Topbar -->
    <header class="flex items-center justify-between h-16 px-5 bg-white border-b border-gray-200">
      <button
        (click)="basculerSidebar()"
        class="flex items-center justify-center w-10 h-10 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors"
        aria-label="Basculer le menu"
      >
        <i class="pi pi-bars"></i>
      </button>

      <div class="flex items-center gap-4">
        <span
          class="hidden sm:inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold"
          [class.bg-ensi-100]="estAdmin()"
          [class.text-ensi-700]="estAdmin()"
          [class.bg-gray-100]="!estAdmin()"
          [class.text-gray-600]="!estAdmin()"
        >
          {{ utilisateur()?.role }}
        </span>

        <div class="flex items-center gap-3">
          <div class="flex items-center justify-center w-9 h-9 rounded-full bg-ensi-600 text-white text-xs font-bold">
            {{ initiales() }}
          </div>
          <div class="hidden sm:block leading-tight">
            <div class="text-sm font-semibold text-gray-800">{{ utilisateur()?.label }}</div>
            <div class="text-[11px] text-gray-400">{{ utilisateur()?.username }}</div>
          </div>
        </div>

        <button
          (click)="deconnexion()"
          class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors"
        >
          <i class="pi pi-sign-out"></i>
          <span class="hidden sm:inline">Déconnexion</span>
        </button>
      </div>
    </header>

    <!-- Contenu -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
